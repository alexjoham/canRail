name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Check clang-format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang-format

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' files < <(git ls-files -z -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' \
            '*.h' '*.hh' '*.hpp' '*.hxx')
          if ((${#files[@]})); then
            clang-format --dry-run --Werror "${files[@]}"
          fi

  build-and-lint:
    name: Build and check clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO and clang-tidy
        run: |
          python -m pip install --upgrade pip platformio
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-tidy

      - name: Build PlatformIO project
        run: pio run -e uno

      - name: Generate compilation database
        run: pio run -e uno -t compiledb

      - name: Run clang-tidy
        run: clang-tidy -p . src/main.cpp